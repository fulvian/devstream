name: Basic CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  basic-checks:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Check if code is valid (basic syntax)
      run: |
        echo "✅ Repository structure check"
        if [ -f "README.md" ]; then
          echo "✅ README.md exists"
        fi

    - name: List repository contents
      run: |
        echo "📁 Repository structure:"
        ls -la

    - name: Check for common project files
      run: |
        echo "🔍 Checking for project files..."
        [ -f "package.json" ] && echo "✅ Node.js project detected" || true
        [ -f "requirements.txt" ] && echo "✅ Python project detected" || true
        [ -f "Cargo.toml" ] && echo "✅ Rust project detected" || true
        [ -f "go.mod" ] && echo "✅ Go project detected" || true
        echo "✅ Project files check completed"