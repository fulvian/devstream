# GitHub Branch Protection Rules for DevStream
# Repository: devstream
# Single developer project - MINIMAL PROTECTIONS (Opzione B)
#
# Configurazione:
# ✅ Force push disabilitati (sicurezza base)
# ✅ Cancellazioni disabilitate (sicurezza base)
# ❌ NO PR obbligatori (workflow semplice)
# ❌ NO enforce admins (massima flessibilità)
#
# Workflow: git add → git commit → git push (diretto a main)

branches:
  - name: main
    protection:
      # Protezioni minime essenziali
      allow_force_pushes: false      # Protegge da git push --force accidentale
      allow_deletions: false          # Protegge da eliminazione accidentale del branch

      # NO PR obbligatori (rimossi per workflow semplice)
      required_pull_request_reviews: null

      # NO status checks (non necessari per solo developer)
      required_status_checks: null

      # NO enforce admins (admin può bypassare se necessario)
      enforce_admins: false

      # Altre opzioni (flessibilità massima)
      required_conversation_resolution: false
      lock_branch: false
      allow_fork_syncing: true
      block_creations: false