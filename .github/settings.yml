# GitHub Branch Protection Rules for DevStream
# Repository: devstream
# Single developer project with basic protections

branches:
  - name: main
    protection:
      # Prevenire modifiche distruttive
      allow_force_pushes: false
      allow_deletions: false

      # Pull request requirements (soft per sviluppatore singolo)
      required_pull_request_reviews:
        required_approving_review_count: 1
        dismiss_stale_reviews: false
        require_code_owner_reviews: false
        require_last_push_approval: false
        dismissal_restrictions: null

      # Status checks (disabilitati - non hai CI/CD ancora)
      required_status_checks: null

      # Applica regole anche all'admin (importante!)
      enforce_admins: true

      # Altre opzioni
      required_conversation_resolution: false
      lock_branch: false
      allow_fork_syncing: true